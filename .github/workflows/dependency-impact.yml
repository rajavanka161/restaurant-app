# Copy this file to .github/workflows/dependency-impact.yml in any repository, public or private, whose pull requests you want
# checked. Every pull request then gets one comment (updated on each push) saying what the change could affect, what it removes
# and which tests to run, plus an advisory status line. It never fails or blocks the pull request.
#
# One-time setup in that repository: Settings > Secrets and variables > Actions > New repository secret
#   Name DEPGRAPH_DEPLOY_KEY, value the private half of a read-only deploy key added to the code dependency platform repository.
# (For a private repository that is allowed to use the platform's action directly, see dependency-impact-private.yml: no secret.)
name: Dependency impact

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The tool's branch or tag. Pin a tag such as v0.2.0 if you want a fixed version.
      - uses: actions/checkout@v7
        with:
          repository: rajavanka161/cdp
          ref: main
          ssh-key: ${{ secrets.DEPGRAPH_DEPLOY_KEY }}
          path: .depgraph-tool
      - uses: ./.depgraph-tool/.github/actions/dependency-impact
