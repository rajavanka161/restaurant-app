# Copy this file to .github/workflows/dependency-impact.yml in any repository whose pull requests you want checked.
# Every pull request then gets one comment (updated on each push) saying what the change could affect, what it removes,
# and which tests to run, plus an advisory status line. It never fails or blocks the pull request.
#
# The action lives in the code dependency platform repository. If that repository is private, it must allow other repositories
# of the same owner to use it: Settings > Actions > General > Access > "Accessible from repositories owned by the user".
name: Dependency impact

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Use the tool's branch or tag you trust; change feature/graph-coverage to main once it is merged.
      - uses: rajavanka161/cdp/.github/actions/dependency-impact@feature/graph-coverage
